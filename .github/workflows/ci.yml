name: Pappus CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pappus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pappus-tests-mpfr:
    name: pappus-tests-mpfr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Configure
        run: >-
          nix develop -c cmake -S . -B build/ci-mpfr
          -DCMAKE_BUILD_TYPE=Release
          -Dpappus_DEVELOPER_MODE=ON
          -DBUILD_TESTING=ON
          -DPAPPUS_ENABLE_MPFR_SOUNDNESS=ON
          -DPAPPUS_TARGET_ARCH=x86-64-v3
      - name: Build tests
        run: nix develop -c cmake --build build/ci-mpfr --target paptest --parallel 2
      - name: Run tests
        run: nix develop -c ctest --test-dir build/ci-mpfr --output-on-failure --no-tests=error --parallel 2

  pappus-tests-no-mpfr:
    name: pappus-tests-no-mpfr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Configure
        run: >-
          nix develop -c cmake -S . -B build/ci-no-mpfr
          -DCMAKE_BUILD_TYPE=Release
          -Dpappus_DEVELOPER_MODE=ON
          -DBUILD_TESTING=ON
          -DPAPPUS_ENABLE_MPFR_SOUNDNESS=OFF
          -DPAPPUS_TARGET_ARCH=x86-64-v3
      - name: Build tests
        run: nix develop -c cmake --build build/ci-no-mpfr --target paptest --parallel 2
      - name: Run tests
        run: nix develop -c ctest --test-dir build/ci-no-mpfr --output-on-failure --no-tests=error --parallel 2
